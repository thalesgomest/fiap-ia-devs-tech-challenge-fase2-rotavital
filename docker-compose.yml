# Sobe a aplicação e um Ollama local. Na primeira execução, baixe o modelo:
#   docker compose exec ollama ollama pull llama3.1:8b
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
    volumes:
      - ./data:/app/data
      - ./scenarios:/app/scenarios
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.3.14
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
